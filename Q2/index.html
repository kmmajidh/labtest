<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple User Profile Card</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Profile Card Container -->
    <div class="profile-card">
        <!-- Dummy image from a placeholder service -->
        <img src="https://via.placeholder.com/100" alt="User Profile Picture">
        
        <!-- User's name -->
        <h3>Jane Doe</h3>
        
        <!-- Short bio -->
        <p>Web Developer and tech enthusiast. I love building simple, elegant websites.</p>
        
        <!-- Follow button -->
        <button>Follow</button>
    </div>

</body>
</html>
